[project]
name = "deepsearchagent"
version = "0.1.0"
description = "Bounded asynchronous research with relevance-focused answer evaluation"
readme = "README.md"
authors = [
    { name = "W3k01", email = "86103882+W3k01@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=3.28.0",
    "pydantic>=2.12.0",
    "langgraph>=1,<2",
    "mcp>=1.26,<2",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
deepsearchagent = "deepsearchagent.cli:main"
deepsearchagent-ui = "deepsearchagent.ui:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "ruff>=0.17.0",
]
